name: HakimAgent CI/CD Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run All Automated QA Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for Headless GUI & Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb* xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Execute Full Pytest Test Suite
        env:
          PYTHONPATH: backend
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v --tb=short
