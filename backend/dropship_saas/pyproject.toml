[project]
name = "dropship-saas"
version = "0.1.0"
description = "SaaS platform for automating dropshipping product extraction and management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "textual>=0.80.0",
    "PySide6>=6.8.0",
    "markdown>=3.7",
    "pygments>=2.19",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "duckduckgo-search>=7.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.10.0",
    "psycopg2-binary>=2.9.9",
    "timescaledb>=2.14.0",
    "celery[redis]>=5.4.0",
    "scrapling>=0.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
]

[project.optional-dependencies]
# Enables distributed rate limiting and background job processing
redis = ["redis>=5.0.0"]

[project.scripts]
axiom = "cli.main:main"
axiom-tui = "cli.main:tui"
axiom-desktop = "desktop.web_app:main"
axiom-serve = "axiom.api.main:start"

[tool.setuptools.packages.find]
where = ["."]
include = ["dropship_saas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"