services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dropship
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dropship_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://dropship:password@postgres:5432/dropship_saas
      - REDIS_URL=redis://redis:6379/0
    command: celery -A dropship_saas.celery_app.celery_app worker --loglevel=info

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
      - celery_worker
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dropship:password@postgres:5432/dropship_saas
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn dropship_saas.api.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data: