[project]
name = "dropship-saas"
version = "0.2.0"
description = "AliDropship SaaS — AliExpress/Amazon scraping + WooCommerce integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.10.0",
    "asyncpg>=0.29.0",
    "celery[redis]>=5.4.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "aiohttp>=3.9.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "mypy"]
docker = ["docker-compose"]

[project.scripts]
dropship = "cli.main:main"
dropship-tui = "cli.main:tui"
dropship-serve = "api.main:start"

[tool.setuptools.packages.find]
where = ["."]
include = ["dropship_saas*", "dropship_saas.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"